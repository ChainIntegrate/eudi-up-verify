<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16314a"/><stop offset="1" stop-color="#0a1220"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe6ff"/><stop offset="1" stop-color="#2fa9d6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" rx="140" fill="url(#bg)"/>
  <g stroke="#2a4a66" stroke-width="2" opacity="0.7">
    <line x1="60" y1="140" x2="250" y2="60"/><line x1="250" y1="60" x2="420" y2="120"/>
    <line x1="620" y1="700" x2="760" y2="600"/><line x1="560" y1="760" x2="620" y2="700"/>
  </g>
  <g fill="#3b6f93" opacity="0.8"><circle cx="60" cy="140" r="6"/><circle cx="250" cy="60" r="6"/><circle cx="420" cy="120" r="5"/><circle cx="620" cy="700" r="6"/><circle cx="760" cy="600" r="5"/></g>
  <!-- shield -->
  <path d="M400 150 L590 220 V400 C590 520 510 600 400 650 C290 600 210 520 210 400 V220 Z"
        fill="#0e1c2c" stroke="url(#ring)" stroke-width="22" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- check -->
  <path d="M305 400 L375 470 L500 335" fill="none" stroke="#7fe6ff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="400" y="742" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="6" fill="#c9d6e2">UP CIE LINK</text>
</svg>
