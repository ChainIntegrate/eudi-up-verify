# nginx site for up-cie-link.chainintegrate.it (template).
#   1. values agreed on 2026-10-15 (port 3015, /var/www/up-cie-link): see docs/operations.md
#   2. sudo cp deploy/nginx/up-cie-link.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/up-cie-link.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. TLS: sudo certbot --nginx -d up-cie-link.chainintegrate.it (certbot adds the 443 listener to this block;
#      HSTS below takes effect on HTTPS only)
# This file is included in nginx's http{} context, so zones and log formats can be declared here.

# UCL-15: per-IP request rate for the API, on top of the backend's own limits
limit_req_zone $binary_remote_addr zone=ucl_api:10m rate=10r/s;

# UCL-16: access log without query strings. The path can contain a UP address (/verifica/0x..., /api/badge/0x...)
# and is paired with the client IP: the privacy notice says these logs are deleted after 14 days, so check
# /etc/logrotate.d/nginx (daily + rotate 14) on the server.
log_format ucl_minimal '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

upstream up_cie_link_backend {
    server 127.0.0.1:3015;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name up-cie-link.chainintegrate.it;
    server_tokens off;

    # statements, signatures and CieSign .p7m files are small
    client_max_body_size 128k;

    access_log /var/log/nginx/up-cie-link.access.log ucl_minimal;
    error_log /var/log/nginx/up-cie-link.error.log warn;

    # Same policy as backend/test/frontend.e2e.test.js: no inline code, nothing loaded from other sites.
    # add_header is NOT inherited by a location that has its own add_header: every location below repeats the set.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    set $pp "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy $pp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # UCL-23: health details are for the local monitor only (it calls 127.0.0.1:PORT directly)
    location = /api/health {
        return 404;
    }

    location /api/ {
        limit_req zone=ucl_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://up_cie_link_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # overwrite (not append): the backend trusts only the loopback proxy for the client IP (rate limits)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # UCL-40: these two come from the server block above; drop the backend's copy
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # UCL-40: the frontend README is not part of the site
    location = /README.md {
        return 404;
    }

    # frontend: static files of the repository, no build step
    root /var/www/up-cie-link/frontend;

    # badge metadata (LSP4): read by wallets and explorers on other sites
    location /metadata/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy $pp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    location ~ ^/(js|css|img)/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy $pp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    # SVG sources of the images are not served
    location ^~ /img/src/ {
        return 404;
    }

    # pages: /, /collega, /verifica/<up>, /il-mio-bollino, /privacy, /note-legali (routed in the browser)
    location / {
        try_files $uri /index.html;
    }
}
