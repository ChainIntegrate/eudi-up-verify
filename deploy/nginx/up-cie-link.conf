# nginx site for up-cie-link.chainintegrate.it (template).
#   1. set the backend PORT (same as backend/.env) in the upstream below
#   2. sudo cp deploy/nginx/up-cie-link.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/up-cie-link.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. TLS: sudo certbot --nginx -d up-cie-link.chainintegrate.it
upstream up_cie_link_backend {
    server 127.0.0.1:CHANGE_ME_PORT;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name up-cie-link.chainintegrate.it;

    # statements, signatures and CieSign .p7m files are small
    client_max_body_size 128k;

    # do not log query strings or bodies; the API never puts personal data in URLs
    access_log /var/log/nginx/up-cie-link.access.log;
    error_log /var/log/nginx/up-cie-link.error.log warn;

    # same policy as backend/test/frontend.e2e.test.js: no inline code, nothing loaded from other sites
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://up_cie_link_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # overwrite (not append): the backend trusts only the loopback proxy for the client IP (rate limits)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # frontend: static files of the repository, no build step
    root /CHANGE_ME/up-cie-link/frontend;

    # badge metadata (LSP4): read by wallets and explorers on other sites
    location /metadata/ {
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~ ^/(js|css|img)/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # pages: /, /collega, /verifica/<up>, /il-mio-bollino, /privacy, /note-legali (routed in the browser)
    location / {
        try_files $uri /index.html;
    }
}
